version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - DATA_DIR=/data
      - FRONTEND_ORIGIN=http://localhost:3001
      # MinIO Configuration
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-localhost:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-rf-lake}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      - MINIO_REGION=${MINIO_REGION:-}
      # PostgreSQL Configuration (for Assignment Overlays)
      - PGHOST=${PGHOST:-postgres}
      - PGPORT=${PGPORT:-5432}
      - PGDATABASE=${PGDATABASE:-surveyviewer}
      - PGUSER=${PGUSER:-surveyviewer}
      - PGPASSWORD=${PGPASSWORD:-surveyviewer}
    volumes:
      - ./data:/data:ro
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      - NEXT_PUBLIC_API_BASE=/api/proxy
      - NEXT_TELEMETRY_DISABLED=1
      # Internal backend URL — server-side only, used by the Next.js proxy route.
      - INTERNAL_API_URL=http://backend:8000
      # Auth.js / NextAuth — OIDC via Authentik
      # Set these via .env file or host environment; do NOT hard-code secrets here.
      - NEXTAUTH_URL=${AUTH_URL:-https://rfexplorer.evrslab.com}
      - NEXTAUTH_SECRET=${AUTH_SECRET}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_AUTHENTIK_ID=${AUTH_AUTHENTIK_ID}
      - AUTH_AUTHENTIK_SECRET=${AUTH_AUTHENTIK_SECRET}
      - AUTH_AUTHENTIK_ISSUER=${AUTH_AUTHENTIK_ISSUER:-https://auth.evrslab.com/application/o/rfexplorer}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./data:/data:ro
    ports:
      - "3001:3000"
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${PGDATABASE:-surveyviewer}
      - POSTGRES_USER=${PGUSER:-surveyviewer}
      - POSTGRES_PASSWORD=${PGPASSWORD:-surveyviewer}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Optional: mount migration files for easy access
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-surveyviewer}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
